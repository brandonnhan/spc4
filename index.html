<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Players Championship</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --fairway-dark:#122A1C; --fairway:#1E4430; --fairway-light:#2B5C40;
    --cream:#F4EFE1; --cream-dim:#E7DFC8; --line:#C9BE9E;
    --chud:#1F5FA8; --chud-dim:#A9CBE8; --gold:#CBA135;
    --ink:#1B1B16; --ink-soft:#4A473C; --danger:#F08A73; --ok:#7EC87E; --warn:#FFCC80;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--fairway-dark); color:var(--cream);
    background-image:radial-gradient(circle at 20% 10%, rgba(255,255,255,0.03), transparent 40%),
                     radial-gradient(circle at 80% 90%, rgba(255,255,255,0.03), transparent 40%);
    font-family:'Oswald','Arial Narrow',sans-serif; min-height:100vh; padding-bottom:60px;
  }
  .mono{font-family:'Space Mono',monospace;}
  header{padding:28px 16px 18px; text-align:center; border-bottom:3px solid var(--gold);
    background:linear-gradient(180deg, var(--fairway) 0%, var(--fairway-dark) 100%);}
  .eyebrow{font-family:'Space Mono',monospace; letter-spacing:4px; font-size:11px; font-weight:700;
    color:var(--gold); text-transform:uppercase; margin-bottom:6px;}
  h1{font-size:clamp(22px,5.5vw,42px); margin:0; font-weight:700; letter-spacing:2px; text-transform:uppercase;
    color:#fff; -webkit-text-stroke:1px var(--gold); line-height:1.1;}
  .subhead{font-family:'Space Mono',monospace; font-size:12px; color:var(--cream-dim); margin-top:8px; letter-spacing:1px;}

  .demo-banner{background:var(--gold); color:var(--ink); text-align:center; font-family:'Space Mono',monospace;
    font-size:11px; padding:8px 12px; line-height:1.5;}

  nav.tabs{display:flex; max-width:820px; margin:0 auto; position:sticky; top:0; z-index:20;
    background:var(--fairway-dark); border-top:2px solid rgba(244,239,225,0.18);
    border-bottom:2px solid rgba(244,239,225,0.18); box-shadow:0 2px 8px rgba(0,0,0,0.45); overflow-x:auto;}
  nav.tabs button{flex:1; min-width:72px; background:none; border:none; color:var(--cream-dim);
    font-family:'Oswald',sans-serif; font-size:14px; letter-spacing:1px; text-transform:uppercase;
    padding:16px 6px; cursor:pointer; border-bottom:3px solid transparent;}
  nav.tabs button.active{color:var(--gold); border-bottom-color:var(--gold);}
  nav.tabs button:focus-visible{outline:2px solid var(--gold); outline-offset:-2px;}
  nav.tabs button[hidden]{display:none;}

  main{max-width:820px; margin:0 auto; padding:20px 16px;}
  main > section{display:none;}
  main > section.active{display:block;}

  .card{background:var(--fairway); border:1px solid rgba(244,239,225,0.15); border-radius:8px;
    padding:18px 16px; margin-bottom:14px;}
  .card h3{font-size:16px; text-transform:uppercase; letter-spacing:1.5px; color:var(--gold); margin:0 0 14px; font-weight:600;}
  .section-title{font-size:15px; text-transform:uppercase; letter-spacing:2px; color:var(--gold);
    border-bottom:1px solid rgba(244,239,225,0.15); padding-bottom:8px; margin:24px 0 14px; font-weight:600;}
  .kv-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:14px 18px; margin-bottom:14px;}
  .kv .k{font-family:'Space Mono',monospace; font-size:10px; color:var(--gold); text-transform:uppercase; letter-spacing:1px;}
  .kv .v{font-size:17px; margin-top:2px;}
  .kv .v small{display:block; font-family:'Space Mono',monospace; font-size:11px; color:var(--cream-dim);}
  .muted{color:var(--cream-dim);} .small{font-size:12px;}
  .body-text{font-family:'Space Mono',monospace; font-size:12px; line-height:1.7; color:var(--cream);}

  .spots{margin:16px 0;}
  .spots-bar{height:10px; border-radius:5px; background:rgba(244,239,225,0.15); overflow:hidden;}
  .spots-bar div{height:100%; background:var(--gold);}
  .spots-label{font-family:'Space Mono',monospace; font-size:11px; color:var(--cream-dim); margin-top:6px;}

  .btn{font-family:'Oswald',sans-serif; font-size:14px; text-transform:uppercase; letter-spacing:1px;
    padding:11px 20px; border-radius:4px; cursor:pointer; border:1px solid var(--line);
    background:rgba(255,255,255,0.08); color:var(--cream);}
  .btn:hover{border-color:var(--gold);}
  .btn.primary{background:var(--gold); color:var(--ink); font-weight:700; border-color:var(--gold);}
  .btn.full{width:100%;}
  .btn.sm{font-size:11px; padding:6px 10px;}
  .btn.danger{border-color:var(--danger); color:var(--danger);}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btn-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}

  .field{margin-bottom:14px;}
  .field > label{display:block; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; color:var(--gold);
    text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}
  .field .hint{font-family:'Space Mono',monospace; font-size:10px; color:var(--cream-dim); margin-top:5px; line-height:1.5;}
  input, select, textarea{width:100%; background:rgba(255,255,255,0.1); border:1px solid var(--line); border-radius:4px;
    color:var(--cream); font-family:'Space Mono',monospace; font-size:14px; padding:10px 12px;}
  input:focus, select:focus, textarea:focus{outline:none; border-color:var(--gold);}
  select option{background:var(--fairway-dark);}
  textarea{min-height:120px; resize:vertical;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 12px;}
  .check{display:flex; gap:10px; align-items:flex-start; font-family:'Space Mono',monospace; font-size:12px; cursor:pointer; line-height:1.5;}
  .check input{width:18px; height:18px; flex-shrink:0; margin-top:1px; accent-color:var(--gold);}
  .pin-input{font-size:22px; letter-spacing:8px; text-align:center; font-weight:700;}

  .terms{background:rgba(0,0,0,0.2); border-left:3px solid var(--gold); border-radius:0 6px 6px 0; padding:12px 14px; margin:18px 0 14px;}
  .terms-title{font-family:'Space Mono',monospace; font-size:11px; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:1px;}
  .terms ul{padding-left:18px; margin:8px 0 12px; font-family:'Space Mono',monospace; font-size:11px; line-height:1.7;}

  .notice{font-family:'Space Mono',monospace; font-size:11px; color:var(--warn); background:rgba(203,161,53,0.12);
    border-left:3px solid var(--warn); padding:10px 12px; border-radius:0 4px 4px 0; margin-bottom:14px; line-height:1.6;}
  .error{color:var(--danger); font-family:'Space Mono',monospace; font-size:12px; margin:8px 0; min-height:1em;}
  .empty, .loading{text-align:center; padding:36px 16px; color:var(--cream-dim); font-family:'Space Mono',monospace; font-size:12px;}

  .update{background:var(--fairway); border:1px solid rgba(244,239,225,0.15); border-radius:8px; padding:14px 16px; margin-bottom:12px;}
  .update.pinned{border-color:var(--gold);}
  .update-head{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px;}
  .chip{font-family:'Space Mono',monospace; font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:1px;
    padding:2px 7px; border-radius:3px; background:rgba(203,161,53,0.2); color:var(--gold); border:1px solid rgba(203,161,53,0.5);}
  .chip.pin{background:var(--gold); color:var(--ink);}
  .update-date{font-family:'Space Mono',monospace; font-size:10px; color:var(--cream-dim); margin-left:auto;}
  .update-title{font-size:18px; font-weight:600; margin:2px 0 6px;}
  .update-body{font-family:'Space Mono',monospace; font-size:12px; line-height:1.7; color:var(--cream); word-wrap:break-word;}
  .update-body a{color:var(--gold);}

  .status{display:inline-block; padding:4px 10px; border-radius:4px; font-family:'Space Mono',monospace; font-size:11px;
    text-transform:uppercase; letter-spacing:1px; font-weight:700;}
  .status.Pending{background:var(--warn); color:var(--ink);}
  .status.Confirmed{background:var(--ok); color:var(--ink);}
  .status.Waitlist{background:var(--chud-dim); color:var(--ink);}
  .status.Withdrawn{background:#777; color:#fff;}

  .paybox{background:var(--cream); color:var(--ink); border-radius:8px; padding:16px; margin-top:14px;}
  .paybox .pb-title{font-size:16px; text-transform:uppercase; letter-spacing:1px; font-weight:700; margin-bottom:10px;}
  .pb-row{display:flex; justify-content:space-between; gap:12px; font-family:'Space Mono',monospace; font-size:12px;
    padding:6px 0; border-bottom:1px solid var(--line);}
  .pb-row b{text-align:right; word-break:break-all;}
  .pb-ref-label{font-family:'Space Mono',monospace; font-size:11px; margin-top:14px; font-weight:700;}
  .refcode{font-family:'Space Mono',monospace; font-size:28px; font-weight:700; letter-spacing:3px; margin:4px 0 8px;}
  .paybox .btn{color:var(--ink); border-color:var(--ink-soft); background:transparent;}
  .pb-note{font-family:'Space Mono',monospace; font-size:10px; color:var(--ink-soft); line-height:1.6; margin:10px 0 0;}
  .big-ok{font-size:30px; font-weight:700; color:var(--ok); text-transform:uppercase; letter-spacing:2px; margin:6px 0;}

  .player-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px;}
  .player-chip{background:var(--fairway); border:1px solid rgba(244,239,225,0.15); border-radius:6px; padding:10px 12px; font-size:14px;}

  /* Admin */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:16px;}
  .stat{background:var(--fairway); border:1px solid rgba(203,161,53,0.3); border-radius:6px; padding:10px 12px; text-align:center;}
  .stat .sv{font-size:22px; color:var(--gold);}
  .stat .sl{font-family:'Space Mono',monospace; font-size:9px; color:var(--cream-dim); text-transform:uppercase; margin-top:2px;}
  .subnav{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .subnav button{font-family:'Space Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:1px; padding:7px 12px;
    background:transparent; color:var(--cream-dim); border:1px solid rgba(244,239,225,0.2); border-radius:4px; cursor:pointer;}
  .subnav button.active{color:var(--ink); background:var(--gold); border-color:var(--gold);}
  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .toolbar input, .toolbar select{width:auto; flex:1; min-width:140px; font-size:12px; padding:8px 10px;}
  .table-wrap{overflow-x:auto; border:1px solid rgba(244,239,225,0.12); border-radius:6px;}
  main:has(> #admin.active){max-width:1240px;}
  table.admin{width:100%; min-width:1080px; border-collapse:collapse; font-family:'Space Mono',monospace; font-size:11px;}
  table.admin td.money{white-space:nowrap;}
  table.admin select[data-f=Status]{min-width:118px;}
  table.admin th{background:var(--fairway-dark); color:var(--gold); padding:8px; text-align:left; font-size:9px;
    text-transform:uppercase; letter-spacing:0.8px; white-space:nowrap; position:sticky; top:0;}
  table.admin td{padding:8px; border-top:1px solid rgba(244,239,225,0.08); vertical-align:top;}
  table.admin tr:nth-child(even) td{background:rgba(0,0,0,0.15);}
  table.admin td .sub{color:var(--cream-dim); font-size:10px; margin-top:2px;}
  table.admin input, table.admin select{font-size:11px; padding:5px 6px; min-width:70px;}
  table.admin td.actions{white-space:nowrap;}
  table.admin td.actions .btn{margin:0 4px 4px 0;}
  .owing{color:var(--warn);} .paid{color:var(--ok);}

  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--cream); color:var(--ink);
    font-family:'Space Mono',monospace; font-size:12px; padding:10px 16px; border-radius:6px; box-shadow:0 4px 16px rgba(0,0,0,0.4);
    z-index:100; max-width:90vw; opacity:0; transition:opacity .2s; pointer-events:none;}
  .toast.show{opacity:1;}
  .toast.err{background:var(--danger);}
  footer{text-align:center; font-family:'Space Mono',monospace; font-size:10px; color:var(--cream-dim); padding:20px;}

  @media (max-width:480px){
    nav.tabs button{font-size:11px; padding:14px 6px;}
    .grid2{grid-template-columns:1fr;}
    .refcode{font-size:24px;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>

<header>
  <div class="eyebrow" id="hdr-eyebrow">The 4th Annual</div>
  <h1>Special Players Championship</h1>
  <div class="subhead" id="hdr-sub">&nbsp;</div>
</header>
<div class="demo-banner" id="demo-banner" hidden>Demo mode: not connected to your Google Sheet. Paste your Apps Script URL into API_URL to go live. Admin PIN in demo: 123456</div>

<nav class="tabs">
  <button data-tab="home" class="active">Home</button>
  <button data-tab="signup">Sign Up</button>
  <button data-tab="myspot">My Spot</button>
  <button data-tab="players">Players</button>
  <button data-tab="admin" id="admin-tab" hidden>Admin</button>
</nav>

<main>
  <section id="home" class="active"></section>
  <section id="signup"></section>
  <section id="myspot"></section>
  <section id="players"></section>
  <section id="admin"></section>
</main>

<footer>Questions? Reply to any tournament email.</footer>
<div class="toast" id="toast"></div>

<script>
// ═══════════════ CONFIG ═══════════════
// Paste your Apps Script web app URL (ends in /exec). Leave blank to run in demo mode.
const API_URL = 'https://script.google.com/macros/s/AKfycbyk5z6dVYoD91k0M4NQo6RGeUopijIZI7ETuajggiOSh4CPl0xMYDa2UjtQnYYgxWE/exec';
const DEMO = !API_URL;

const HANDICAPS = ['+1 or better to 0.0','0.1 to 4.9','5.0 to 9.9','10.0 to 12.9','13.0 to 15.9','16.0 to 19.9','20.0 to 24.9','25.0 to 29.9','Over 30.0'];
const TEES = ['Front Tees (Red)','White Tees','Blue Tees','Black Tees (Tips)'];
const STATUSES = ['Pending','Confirmed','Waitlist','Withdrawn'];
const STATUS_LABEL = { Pending:'Awaiting payment', Confirmed:'Confirmed', Waitlist:'Waitlist', Withdrawn:'Withdrawn' };

// ═══════════════ STATE ═══════════════
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} }
};
const state = {
  tab:'home', pub:null, pubError:null,
  token: store.get('spc4_token'), me:null,
  adminToken: null, admin:null, adminTab:'players'
};
try{ state.adminToken = sessionStorage.getItem('spc4_admin'); }catch(e){}
function setAdminToken(t){ state.adminToken = t; try{ t ? sessionStorage.setItem('spc4_admin', t) : sessionStorage.removeItem('spc4_admin'); }catch(e){} }

// ═══════════════ HELPERS ═══════════════
const $ = s => document.querySelector(s);
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n){ n = Number(n) || 0; return n % 1 ? n.toFixed(2) : String(n); }
function fmtDate(iso, withTime){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d)) return iso;
  const o = { month:'short', day:'numeric', year:'numeric' };
  if(withTime){ o.hour = 'numeric'; o.minute = '2-digit'; }
  return d.toLocaleString('en-CA', o);
}
function linkify(escaped){ return escaped.replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`); }
function loading(){ return '<div class="loading">Loading…</div>'; }
function field(label, control, hint){ return `<div class="field"><label>${label}</label>${control}${hint ? `<div class="hint">${hint}</div>` : ''}</div>`; }
function selectHtml(name, opts, value, placeholder){
  return `<select name="${name}"><option value="">${placeholder || '— Select —'}</option>${opts.map(o => `<option${o === value ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
}
let toastTimer;
function toast(msg, isErr){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 3200);
}

async function api(action, payload){
  const body = Object.assign({ action }, payload || {});
  let d;
  if(DEMO){
    await new Promise(r => setTimeout(r, 200));
    try{ d = Object.assign({ ok:true }, JSON.parse(JSON.stringify(demoApi(body) || {}))); }
    catch(e){ d = { ok:false, error:e.message, code:e.code }; }
  } else {
    let res;
    try{ res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify(body) }); }
    catch(e){ throw new Error("Can't reach the server. Check your connection."); }
    if(!res.ok) throw new Error("Can't reach the server. Check your connection.");
    d = await res.json();
  }
  if(!d.ok){ const err = new Error(d.error || 'Something went wrong.'); err.code = d.code; throw err; }
  return d;
}

// ═══════════════ NAV ═══════════════
function go(tab){
  state.tab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('main > section').forEach(s => s.classList.toggle('active', s.id === tab));
  render();
  window.scrollTo(0, 0);
}
function render(){
  ({ home:renderHome, signup:renderSignup, myspot:renderMySpot, players:renderPlayers, admin:renderAdmin })[state.tab]();
}
document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));

async function loadPublic(){
  try{ state.pub = await api('public'); state.pubError = null; }
  catch(e){ state.pubError = e.message; }
  if(state.pub){
    const e = state.pub.event;
    $('#hdr-sub').textContent = [e.date, e.venue].filter(x => x && x !== 'TBA').join(' · ') || 'Date and venue coming soon';
  }
  if(['home','signup','players'].includes(state.tab)) render();
}
function pubGuard(el){
  if(state.pub) return false;
  el.innerHTML = state.pubError ? `<div class="empty">${esc(state.pubError)}<div class="btn-row" style="justify-content:center"><button class="btn sm" data-act="reloadPublic">Try again</button></div></div>` : loading();
  return true;
}

// ═══════════════ HOME ═══════════════
function renderHome(){
  const el = $('#home');
  if(pubGuard(el)) return;
  const { event:e, spots:sp, updates } = state.pub;
  const left = Math.max(0, sp.capacity - sp.taken);
  const pct = Math.min(100, sp.capacity ? sp.taken / sp.capacity * 100 : 0);
  const kv = (k, v, sub) => `<div class="kv"><div class="k">${k}</div><div class="v">${esc(v || 'TBA')}${sub ? `<small>${esc(sub)}</small>` : ''}</div></div>`;
  const cta = !e.registrationOpen ? '<button class="btn full" disabled>Registration closed</button>'
            : state.token ? '<button class="btn full" data-act="go" data-tab="myspot">View my spot</button>'
            : `<button class="btn primary full" data-act="go" data-tab="signup">${left > 0 ? 'Sign up' : 'Join the waitlist'}</button>`;
  el.innerHTML = `
    <div class="card">
      <div class="kv-grid">
        ${kv('Date', e.date)}${kv('First tee', e.firstTee)}${kv('Venue', e.venue, e.venueAddress)}
        ${kv('Fee', e.fee ? '$' + money(e.fee) : 'TBA')}${kv('Payment deadline', e.paymentDeadline)}
      </div>
      ${e.feeIncludes ? `<div class="body-text muted">Fee includes: ${esc(e.feeIncludes)}</div>` : ''}
      <div class="spots">
        <div class="spots-bar"><div style="width:${pct}%"></div></div>
        <div class="spots-label">${sp.confirmed} confirmed · ${left} of ${sp.capacity} spots left${sp.waitlist ? ` · ${sp.waitlist} on the waitlist` : ''}</div>
      </div>
      ${cta}
    </div>
    <h2 class="section-title">Updates</h2>
    ${updates.length ? updates.map(updateCard).join('') : '<div class="empty">No updates yet. Check back soon.</div>'}`;
}
function updateCard(u){
  return `<div class="update${u.pinned ? ' pinned' : ''}">
    <div class="update-head">${u.pinned ? '<span class="chip pin">Pinned</span>' : ''}<span class="chip">${esc(u.category)}</span><span class="update-date">${esc(fmtDate(u.postedAt))}</span></div>
    <div class="update-title">${esc(u.title)}</div>
    <div class="update-body">${linkify(esc(u.body)).replace(/\n/g, '<br>')}</div>
  </div>`;
}

// ═══════════════ SIGN UP ═══════════════
function renderSignup(){
  const el = $('#signup');
  if(pubGuard(el)) return;
  const { event:e, spots:sp } = state.pub;
  const left = sp.capacity - sp.taken;
  if(state.token){
    el.innerHTML = `<div class="card"><h3>You're registered</h3><p class="body-text">You're signed in on this device.</p><button class="btn primary" data-act="go" data-tab="myspot">View my spot</button></div>`;
    return;
  }
  if(!e.registrationOpen){
    el.innerHTML = `<div class="card"><h3>Registration is closed</h3><p class="body-text">Watch the Home page for updates.</p></div>`;
    return;
  }
  const deadline = e.paymentDeadline && e.paymentDeadline !== 'TBA' ? e.paymentDeadline : 'the payment deadline';
  el.innerHTML = `
    ${left <= 0 ? `<div class="notice">All ${sp.capacity} spots are taken. Signing up now puts you on the waitlist. Don't send payment unless you get an email saying a spot opened.</div>` : ''}
    <form id="signup-form" class="card" novalidate>
      <h3>Sign up</h3>
      <div class="grid2">
        ${field('First name', '<input name="firstName" autocomplete="given-name" maxlength="40">')}
        ${field('Last name', '<input name="lastName" autocomplete="family-name" maxlength="40">')}
      </div>
      ${field('Email', '<input name="email" type="email" autocomplete="email" maxlength="254">', 'Updates and your payment confirmation go here.')}

async function submitSignup(ev){
  ev.preventDefault();
  const f = ev.target, err = $('#signup-err'), btn = f.querySelector('button[type=submit]');
  const v = n => f.elements[n].value.trim();
  const data = { firstName:v('firstName'), lastName:v('lastName'), email:v('email'), phone:v('phone'),
    partner:v('partner'), referredBy:v('referredBy'), handicap:v('handicap'), tees:v('tees'),
    avgScore:v('avgScore'), dinner:v('dinner'), agree:f.elements.agree.checked };
  const missing = Object.entries(data).filter(([k, val]) => k !== 'agree' && !val);
  if(missing.length){ err.textContent = 'Please fill in every field.'; return; }
  if(!data.agree){ err.textContent = 'Please agree to the terms.'; return; }
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Signing up…';
  try{
    const res = await api('register', data);
    state.token = res.token; store.set('spc4_token', res.token); state.me = res.me;
    toast(res.me.status === 'Waitlist' ? "You're on the waitlist." : "You're signed up! Check your email.");
    loadPublic();
    go('myspot');
  }catch(e){
    err.textContent = e.message; btn.disabled = false; btn.textContent = 'Sign up';
  }
}

async function adminCall(action, payload, okMsg){
  try{
    const res = await api(action, Object.assign({ token:state.adminToken }, payload));
    if(okMsg) toast(typeof okMsg === 'function' ? okMsg(res) : okMsg);
    state.admin = null; await renderAdmin(); loadPublic();
    return res;
  }catch(e){
    if(e.code === 'auth'){ setAdminToken(null); state.admin = null; renderAdmin(); }
    toast(e.message, true);
  }
}

function bindAdmin(){
  const search = $('#pl-search'), filter = $('#pl-filter');
  if(search){
    const apply = () => {
      const q = search.value.trim().toLowerCase(), st = filter.value;
      document.querySelectorAll('#pl-body tr').forEach(tr => {
        tr.style.display = (!q || tr.dataset.search.includes(q)) && (!st || tr.dataset.status === st) ? '' : 'none';
      });
    };
    search.addEventListener('input', apply); filter.addEventListener('change', apply);
  }
  const uf = $('#update-form');
  if(uf) uf.addEventListener('submit', async ev => {
    ev.preventDefault();
    const f = ev.target, btn = f.querySelector('button[type=submit]');
    const d = { title:f.elements.title.value.trim(), category:f.elements.category.value, body:f.elements.body.value.trim(),
                emailTo:f.elements.emailTo.value, pinned:f.elements.pinned.checked };
    if(!d.title || !d.body || !d.category){ $('#update-err').textContent = 'Add a title, category and message.'; return; }
    if(d.emailTo !== 'none' && !confirm('Post this and email it now?')) return;
    btn.disabled = true; btn.textContent = 'Posting…';
    const res = await adminCall('adminPostUpdate', d, r => r.sent ? `Posted and emailed to ${r.sent} player${r.sent === 1 ? '' : 's'}.` : 'Posted.');
    if(!res){ btn.disabled = false; btn.textContent = 'Post update'; }
  });
  const sf = $('#settings-form');
  if(sf) sf.addEventListener('submit', ev => {
    ev.preventDefault();
    const settings = {};
    [...ev.target.elements].forEach(el => { if(el.name) settings[el.name] = el.value.trim(); });
    adminCall('adminSaveSettings', { settings }, 'Settings saved.');
  });
}

// ═══════════════ CLICK ACTIONS ═══════════════
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]');
  if(!b) return;
  const act = b.dataset.act;
  if(act === 'go'){ ev.preventDefault(); go(b.dataset.tab); return; }
  if(act === 'reloadPublic'){ state.pubError = null; render(); loadPublic(); return; }
  if(act === 'copy'){ copyText(b.dataset.text, 'Code copied.'); return; }
  if(act === 'refreshMe'){ state.me = null; renderMySpot(); return; }
  if(act === 'signOut'){ signOut(); return; }
  if(act === 'adminTab'){ state.adminTab = b.dataset.tab; renderAdmin(); return; }
  if(act === 'adminRefresh'){ state.admin = null; renderAdmin(); return; }
  if(act === 'adminLock'){ setAdminToken(null); state.admin = null; renderAdmin(); return; }
  if(act === 'copyEmails'){
    const st = $('#pl-filter').value;
    const list = state.admin.players.filter(p => st ? p.Status === st : p.Status !== 'Withdrawn').map(p => p.Email);
    copyText(list.join(', '), `${list.length} email${list.length === 1 ? '' : 's'} copied.`); return;
  }
  if(act === 'checkPayments'){
    b.disabled = true; b.textContent = 'Checking…';
    adminCall('adminCheckPayments', {}, r => `Checked ${r.summary.checked}: ${r.summary.matched} matched, ${r.summary.unmatched} unmatched.`);
    return;
  }
  const tr = b.closest('tr');
  if(act === 'savePlayer' || act === 'markPaid' || act === 'promote'){
    const id = tr.dataset.id;
    b.disabled = true;
    if(act === 'savePlayer'){
      const changes = {};
      tr.querySelectorAll('[data-f]').forEach(el => changes[el.dataset.f] = el.value.trim());
      const p = state.admin.players.find(x => x.PlayerId === id);
      if(changes.Status === 'Withdrawn' && p.Status !== 'Withdrawn' && !confirm(`Withdraw ${p.FirstName} ${p.LastName}? Their spot opens up.`)){ b.disabled = false; return; }
      adminCall('adminUpdatePlayer', { playerId:id, changes }, r => r.emailed ? 'Saved. Confirmation emailed.' : 'Saved.');
    } else if(act === 'markPaid'){
      const p = state.admin.players.find(x => x.PlayerId === id);
      if(!confirm(`Mark ${p.FirstName} ${p.LastName} as fully paid? This confirms their spot and emails them.`)){ b.disabled = false; return; }
      adminCall('adminMarkPaid', { playerId:id }, r => 'Marked paid: ' + r.result);
    } else {
      adminCall('adminPromote', { playerId:id }, r => r.emailed ? 'Spot given and player emailed.' : 'Spot given (email failed, let them know).');
    }
    return;
  }
  if(act === 'assignPayment'){
    const playerId = tr.querySelector('[data-f=assign]').value;
    if(!playerId){ toast('Pick a player first.', true); return; }
    adminCall('adminAssignPayment', { messageId:tr.dataset.msg, playerId }, 'Payment assigned.');
    return;
  }
  const wrap = b.closest('[data-uid]');
  if(act === 'pinUpdate'){ adminCall('adminPinUpdate', { updateId:wrap.dataset.uid, pinned:b.dataset.pinned === '1' }, 'Updated.'); return; }
  if(act === 'deleteUpdate'){ if(confirm('Delete this update from the site?')) adminCall('adminDeleteUpdate', { updateId:wrap.dataset.uid }, 'Deleted.'); return; }
});
function copyText(text, msg){
  const done = () => toast(msg);
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback(){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ toast('Copy failed. Select and copy manually.', true); }
    ta.remove();
  }
}

function demoApi(b){
  const db = demoDb;
  const S = () => Object.fromEntries(db.settings.map(r => [r[0], r[1]]));
  const fail = (m, code) => { const e = new Error(m); e.code = code; throw e; };
  const sess = type => { const s = db.sessions[b.token]; if(!s || s.type !== type) fail('Your sign-in expired. Please sign in again.', 'auth'); return s; };
  const newTok = data => { const t = Math.random().toString(36).slice(2) + Date.now(); db.sessions[t] = data; return t; };
  const find = id => db.players.find(p => p.PlayerId === id) || fail('Player not found.');
  const counts = () => { const c = { Pending:0, Confirmed:0, Waitlist:0, Withdrawn:0 }; db.players.forEach(p => c[p.Status]++); return c; };
  const sortU = (a, b) => (a.pinned !== b.pinned) ? (a.pinned ? -1 : 1) : String(b.postedAt).localeCompare(String(a.postedAt));
  const view = p => { const s = S(), due = +p.AmountDue, paid = +p.AmountPaid; return { firstName:p.FirstName, lastName:p.LastName, email:p.Email, partner:p.Partner, dinner:p.Dinner, status:p.Status, refCode:p.RefCode, amountDue:due, amountPaid:paid, balance:Math.max(0, due - paid), team:p.Team, teeId:p.TeeId, registeredAt:p.RegisteredAt, payment:{ email:s.ETRANSFER_EMAIL, deadline:s.PAYMENT_DEADLINE } }; };
  const pay = (p, amt) => { p.AmountPaid = String(+p.AmountPaid + amt); const up = +p.AmountPaid >= +p.AmountDue; if(up && !p.PaidAt) p.PaidAt = new Date().toISOString(); if(p.Status === 'Pending' && up){ p.Status = 'Confirmed'; return 'Confirmed'; } return p.Status === 'Waitlist' ? 'Paid while on waitlist: review' : (up ? 'Recorded' : 'Partial'); };
  switch(b.action){
    case 'public': {
      const s = S(), c = counts();
      return { event:{ name:s.EVENT_NAME, date:s.EVENT_DATE, firstTee:s.FIRST_TEE, venue:s.VENUE, venueAddress:s.VENUE_ADDRESS, fee:+s.FEE, feeIncludes:s.FEE_INCLUDES, paymentDeadline:s.PAYMENT_DEADLINE, registrationOpen:s.REGISTRATION_OPEN === 'TRUE' },
        spots:{ capacity:+s.CAPACITY, taken:c.Pending + c.Confirmed, confirmed:c.Confirmed, waitlist:c.Waitlist },
        updates:db.updates.slice().sort(sortU),
        players:s.SHOW_PLAYER_LIST === 'TRUE' ? db.players.filter(p => p.Status === 'Confirmed').map(p => ({ name:p.FirstName + ' ' + p.LastName, team:p.Team, teeId:p.TeeId })) : null };
    }
    case 'register': {
      const s = S(); const phone = String(b.phone).replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
      if(phone.length !== 10) fail('Enter a 10-digit phone number.');
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(b.email)) fail('Enter a valid email address.');
      if(db.players.some(p => p.Status !== 'Withdrawn' && p.Email.toLowerCase() === b.email.toLowerCase())) fail('That email is already registered. Use My Spot to check your status.');
      const c = counts(), A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const p = { PlayerId:'d' + Date.now(), RegisteredAt:new Date().toISOString(), FirstName:b.firstName, LastName:b.lastName, Email:b.email.toLowerCase(), Phone:phone, Partner:b.partner, ReferredBy:b.referredBy, Handicap:b.handicap, Tees:b.tees, AvgScore:b.avgScore, Dinner:b.dinner,
        Status:(c.Pending + c.Confirmed) < +s.CAPACITY ? 'Pending' : 'Waitlist', RefCode:'SPC4-' + Array.from({ length:5 }, () => A[Math.floor(Math.random() * A.length)]).join(''), AmountDue:s.FEE, AmountPaid:'0', PaidAt:'', Team:'', TeeId:'', AdminNotes:'' };
      db.players.push(p);
      return { token:newTok({ type:'player', id:p.PlayerId }), me:view(p) };
    }
    case 'login': {
      const p = db.players.find(x => x.Status !== 'Withdrawn' && x.Email.toLowerCase() === String(b.email).toLowerCase());
      if(!p || p.Phone.slice(-4) !== String(b.pin)) fail("That email and PIN don't match a registration. (Demo: alex@example.com / 0101)");
      return { token:newTok({ type:'player', id:p.PlayerId }), me:view(p) };
    }
    case 'me': return { me:view(find(sess('player').id)) };
    case 'adminLogin': if(b.pin !== '123456') fail('Wrong admin PIN.'); return { token:newTok({ type:'admin' }) };
    case 'adminData': {
      sess('admin'); const c = counts(), s = S();
      return { players:db.players, payments:db.payments.slice().reverse(), updates:db.updates.slice().sort(sortU), settings:db.settings, categories:['General','Venue','Tee Times','Teams','Team Colours','Prizes','Payments'], emailQuota:100,
        stats:{ confirmed:c.Confirmed, pending:c.Pending, waitlist:c.Waitlist, withdrawn:c.Withdrawn, capacity:+s.CAPACITY,
          collected:db.players.reduce((t, p) => t + +p.AmountPaid, 0),
          outstanding:db.players.filter(p => p.Status === 'Pending' || p.Status === 'Confirmed').reduce((t, p) => t + Math.max(0, p.AmountDue - p.AmountPaid), 0) } };
    }
    case 'adminUpdatePlayer': { sess('admin'); const p = find(b.playerId); Object.assign(p, b.changes); let emailed = false; if(p.Status === 'Pending' && +p.AmountPaid >= +p.AmountDue){ p.Status = 'Confirmed'; emailed = true; } return { emailed }; }
    case 'adminMarkPaid': { sess('admin'); const p = find(b.playerId); return { result:pay(p, Math.max(0, p.AmountDue - p.AmountPaid)) }; }
    case 'adminPromote': { sess('admin'); const p = find(b.playerId); p.Status = +p.AmountPaid >= +p.AmountDue ? 'Confirmed' : 'Pending'; return { emailed:true }; }
    case 'adminPostUpdate': { sess('admin'); const n = b.emailTo === 'none' ? 0 : db.players.filter(p => b.emailTo === 'confirmed' ? p.Status === 'Confirmed' : p.Status !== 'Withdrawn').length;
      db.updates.push({ id:'u' + Date.now(), postedAt:new Date().toISOString(), title:b.title, body:b.body, category:b.category, pinned:!!b.pinned, emailedTo:n ? b.emailTo + ' (' + n + ')' : '' }); return { sent:n }; }
    case 'adminPinUpdate': { sess('admin'); const u = db.updates.find(x => x.id === b.updateId); if(u) u.pinned = !!b.pinned; return {}; }
    case 'adminDeleteUpdate': { sess('admin'); db.updates = db.updates.filter(x => x.id !== b.updateId); return {}; }
    case 'adminSaveSettings': { sess('admin'); db.settings.forEach(r => { if(r[0] in b.settings) r[1] = b.settings[r[0]]; }); return {}; }
    case 'adminCheckPayments': sess('admin'); return { summary:{ checked:0, matched:0, unmatched:0 } };
    case 'adminAssignPayment': { sess('admin'); const r = db.payments.find(x => x.MessageId === b.messageId); const p = find(b.playerId); r.PlayerId = p.PlayerId; r.Result = 'Assigned manually → ' + pay(p, +r.Amount); return {}; }
  }
  fail('Unknown action.');
}
